# Dracula-Nineties: tmux theme
#
# Every value is the sRGB rendering of a dracula-nineties.css :root oklch() token.
# Style only, no content: status-bar text, window-list format and key bindings
# stay whatever your own tmux.conf already sets.
#
# Install: add to ~/.tmux.conf
#   source-file ~/.config/tmux/dracula-nineties.conf

set -g status-style "bg=#1e1f29,fg=#f8f8f2"
set -g status-left-style "fg=#b7bfe4,bg=#1e1f29"
set -g status-right-style "fg=#6272a4,bg=#1e1f29"

set -g window-status-style "fg=#6272a4,bg=#1e1f29"
set -g window-status-current-style "fg=#282a36,bg=#8be9fd,bold"
set -g window-status-activity-style "fg=#ffb86c,bg=#1e1f29"
set -g window-status-bell-style "fg=#ff5555,bg=#1e1f29,bold"

set -g pane-border-style "fg=#707388"
set -g pane-active-border-style "fg=#8be9fd"

set -g message-style "bg=#44475a,fg=#f8f8f2"
set -g message-command-style "bg=#44475a,fg=#8be9fd"

set -g mode-style "bg=#8be9fd,fg=#282a36"

set -g clock-mode-colour "#8be9fd"
set -g clock-mode-style 24
