# Dracula-Nineties: tmux theme
#
# Every value is the sRGB rendering of a dracula-nineties.css :root oklch() token.
# Style only, no content: status-bar text, window-list format and key bindings
# stay whatever your own tmux.conf already sets.
#
# Install: add to ~/.tmux.conf
#   source-file ~/.config/tmux/dracula-nineties.conf

set -g status-style "bg=#12121a,fg=#ffffff"
set -g status-left-style "fg=#c0c0c0,bg=#12121a"
set -g status-right-style "fg=#868686,bg=#12121a"

set -g window-status-style "fg=#868686,bg=#12121a"
set -g window-status-current-style "fg=#000000,bg=#8be9fd,bold"
set -g window-status-activity-style "fg=#ffb86c,bg=#12121a"
set -g window-status-bell-style "fg=#ff5555,bg=#12121a,bold"

set -g pane-border-style "fg=#6a6a6a"
set -g pane-active-border-style "fg=#8be9fd"

set -g message-style "bg=#1e1e2e,fg=#ffffff"
set -g message-command-style "bg=#1e1e2e,fg=#8be9fd"

set -g mode-style "bg=#8be9fd,fg=#000000"

set -g clock-mode-colour "#8be9fd"
set -g clock-mode-style 24
